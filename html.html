<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitaciones | Supabase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --success: #22c55e;
            --bg-soft: #f4f7fb;
            --text: #1f2937;
            --muted: #6b7280;
            --card-shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .hero {
            padding: 70px 0 40px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
        }

        .badge-custom {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary-dark);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        h1 {
            font-weight: 800;
            line-height: 1.15;
            color: #0f172a;
        }

        .lead {
            color: var(--muted);
            font-size: 1.08rem;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            padding: 0.9rem 1.6rem;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(59, 130, 246, 0.4);
        }

        .result-card {
            background: #ffffff;
            border-radius: 22px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: var(--card-shadow);
            padding: 1.5rem;
            min-height: 220px;
        }

        .result-card h3 {
            color: #0f172a;
            font-weight: 700;
        }

        .stat-box {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 14px;
            padding: 1rem;
        }

        .table-responsive {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .table thead th {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            vertical-align: middle;
            padding: 0.9rem 0.8rem;
            border-bottom: none;
        }

        .table tbody td {
            padding: 0.9rem 0.8rem;
            vertical-align: middle;
            color: #1f2937;
            background: #fff;
        }

        .table tbody tr:nth-child(even) td {
            background: #f8fafc;
        }

        .table tbody tr:hover td {
            background: #edf6ff;
        }

        .empty-state {
            color: var(--muted);
            font-size: 1rem;
        }

        .error-text {
            color: #dc2626;
            font-weight: 600;
        }

        .loading {
            color: var(--primary-dark);
            font-weight: 600;
        }

        .badge-total {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-radius: 999px;
            padding: 0.55rem 0.9rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container hero">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="hero-card p-4 p-md-5">
                    <div class="row align-items-center g-4">
                        <div class="col-lg-7">
                            <span class="badge-custom">Capacitaciones disponibles</span>
                            <h1 class="mt-3 mb-3">Listado de capacitaciones en tiempo real</h1>
                            <p class="lead mb-4">
                                Consulta los registros disponibles desde Supabase y visualiza el contenido de manera clara y moderna.
                            </p>
                            <button id="btnCargar" class="btn btn-primary-custom">Cargar capacitaciones</button>
                        </div>

                        <div class="col-lg-5">
                            <div class="stat-box h-100">
                                <p class="text-uppercase text-muted mb-2 small fw-bold">Estado</p>
                                <h3 class="display-6 fw-bold mb-0">API</h3>
                                <p class="text-muted mt-3 mb-0">Conexión activa con Supabase</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-lg-10">
                <div id="resultado" class="result-card">
                    <p class="empty-state mb-0">Aún no has cargado datos.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://boxksysyoayjppxddwrk.supabase.co/rest/v1/capacitaciones?select=*';
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJveGtzeXN5b2F5anBweGRkd3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjYwMTIsImV4cCI6MjEwNzA0MjAxMn0.ctGu4HNwyB8qwwuNspzx8ZUsbHN_uVQ38odhZSRVXPM';

        function formatearValor(valor) {
            if (valor === null || valor === undefined || valor === '') {
                return '—';
            }

            if (typeof valor === 'boolean') {
                return valor ? 'Sí' : 'No';
            }

            if (valor instanceof Date) {
                return valor.toLocaleDateString('es-ES');
            }

            return String(valor);
        }

        function obtenerColumnas(data) {
            const columnas = new Set();

            data.forEach((registro) => {
                if (registro && typeof registro === 'object') {
                    Object.keys(registro).forEach((clave) => columnas.add(clave));
                }
            });

            return Array.from(columnas);
        }

        function renderizarTabla(data) {
            const columnas = obtenerColumnas(data);
            const resultadoDiv = document.getElementById('resultado');

            const cabeceras = columnas.map((columna) => `<th>${columna}</th>`).join('');

            const filas = data.map((registro) => {
                const celdas = columnas.map((columna) => `<td>${formatearValor(registro[columna])}</td>`).join('');
                return `<tr>${celdas}</tr>`;
            }).join('');

            resultadoDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h3 class="mb-0">Capacitaciones</h3>
                    <span class="badge-total">Total: ${data.length}</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead>
                            <tr>${cabeceras}</tr>
                        </thead>
                        <tbody>
                            ${filas}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function obtenerCapacitaciones() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<p class="loading mb-0">Cargando datos...</p>';

            try {
                const response = await fetch(SUPABASE_URL, {
                    method: 'GET',
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': `Bearer ${API_KEY}`,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Datos recibidos:', data);

                if (!Array.isArray(data) || data.length === 0) {
                    resultadoDiv.innerHTML = `
                        <div class="alert alert-warning mb-0" role="alert">
                            <strong>La tabla está vacía o no hay registros disponibles.</strong><br>
                            Verifica que la tabla <b>capacitaciones</b> exista en Supabase y que tenga filas insertadas.
                        </div>
                    `;
                    return;
                }

                renderizarTabla(data);

            } catch (error) {
                console.error('Error al consumir la API:', error);
                resultadoDiv.innerHTML = `<p class="error-text mb-0">Error: ${error.message}</p>`;
            }
        }

        document.getElementById('btnCargar').addEventListener('click', obtenerCapacitaciones);
    </script>
</body>
</html>
